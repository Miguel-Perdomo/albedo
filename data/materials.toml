# Materials available to ALBEDO.
#
# Mass attenuation coefficients: NIST XCOM (Berger et al.), standard energy
# grid, 1 keV - 3 MeV, all quantities in cm2/g. Files in xs/ are the XCOM
# output saved without modification.
#
# Densities: J. H. Hubbell and S. M. Seltzer, Tables of X-Ray Mass Attenuation
# Coefficients and Mass Energy-Absorption Coefficients, NISTIR 5632,
# Tables 1 (elements) and 2 (compounds).

[Cu]
description = "Copper (shield inner liner)"
density = 8.960   # g/cm3
xcom = "xs/Cu.txt"

[Sn]
description = "Tin (shield intermediate liner)"
density = 7.310   # g/cm3
xcom = "xs/Sn.txt"

[Pb]
description = "Lead (shield body)"
density = 11.35   # g/cm3
xcom = "xs/Pb.txt"

[CsI]
description = "Cesium iodide scintillator (Tl doping neglected)"
density = 4.510   # g/cm3
xcom = "xs/CsI.txt"

[NaI]
description = "Sodium iodide scintillator (Tl doping neglected)"
density = 3.667   # g/cm3
xcom = "xs/NaI.txt"
